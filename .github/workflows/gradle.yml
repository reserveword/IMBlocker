name: Java CI

on:
  push:
    branches:
      - '*'
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build Forge 1.12.2 test version
        run: ./gradlew.bat clean build --no-daemon --console plain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imblocker-forge-1.12.2-test
          path: build/libs/*.jar
